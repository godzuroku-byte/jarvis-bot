services:
  - type: web
    name: jarvis-bot
    runtime: python
    buildCommand: bash build.sh
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_ID
        value: "8988340808"
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
    autoDeploy: true
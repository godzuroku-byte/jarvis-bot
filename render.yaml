services:
  - type: web
    name: jarvis-bot
    runtime: python
    buildCommand: bash build.sh
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_ID
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3.7-flash,gemini-2.5-flash"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "60"
    autoDeploy: true